services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: dockhand
      POSTGRES_PASSWORD: dockhand
      POSTGRES_DB: dockhand
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dockhand"]
      interval: 2s
      timeout: 3s
      retries: 15

  api:
    build: .
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql+asyncpg://dockhand:dockhand@db:5432/dockhand
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
