services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: dockhand
      POSTGRES_PASSWORD: dockhand
      POSTGRES_DB: dockhand
    ports:
      # Host port 55432, not 5432: a system-wide PostgreSQL on the dev machine owns 5432 and
      # would silently take connections meant for this container.
      - "55432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dockhand"]
      interval: 2s
      timeout: 3s
      retries: 15

  api:
    build: .
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql+asyncpg://dockhand:dockhand@db:5432/dockhand
      # The assistant reaches the MCP server over the Compose network.
      MCP_URL: http://mcp:8020/mcp
    ports:
      # Host port 8010: 8000 is commonly taken by other local projects. The dashboard (web/)
      # runs on 3010 for the same reason.
      - "8010:8000"
    volumes:
      - media:/srv/data/media
    depends_on:
      db:
        condition: service_healthy

  # MCP server (Streamable HTTP, /mcp). Needs MCP_TOKEN in .env. It reads the same ledger and
  # serves snapshots from the shared media volume through signed links.
  mcp:
    build: .
    command:
      ["uv", "run", "--no-dev", "uvicorn", "--factory", "mcp_server.server:create_app",
       "--host", "0.0.0.0", "--port", "8020"]
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql+asyncpg://dockhand:dockhand@db:5432/dockhand
      MCP_PUBLIC_URL: http://localhost:8020
      MCP_ALLOWED_HOSTS: '["localhost:*","127.0.0.1:*","mcp:8020"]'
    ports:
      - "8020:8020"
    volumes:
      - media:/srv/data/media
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
  media:
